<mat-card>

  <mat-toolbar>Detalhes do Item</mat-toolbar>

  <mat-card-content class="card-container">

    <form [formGroup]="form">
      <mat-form-field class="full-width">
        <input matInput placeholder="Numero de Serie" formControlName="numSerie" type="number" min="0" #numSerie>
        <mat-error *ngIf="form.get('numSerie')?.invalid">{{
          getErrorMessage('numSerie')
          }}</mat-error>
      </mat-form-field>

    </form>

  </mat-card-content>

  <mat-card-actions class="actions-center">
    <button mat-raised-button color="primary" (click)="onSubmit()">Salvar</button>
    <button mat-raised-button (click)="onCancel()">Cancelar</button>
  </mat-card-actions>
</mat-card>
