<mat-card>

  <mat-toolbar class="nav" color="primary">
    <span>Locações Cadastrados </span>
    <button mat-raised-button color="accent" (click)="onAdd()">+ Nova Locação</button>
  </mat-toolbar>

  <div class="column-flex mat-elevation-z8">

    <app-locacao-list
      *ngIf="locacoes$ | async as locacoes; else loading"
      [locacoes]="locacoes"
      (add)="onAdd()"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
      (efetuarPagamento)="efetuarPagamento($event)"
    ></app-locacao-list>

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>

  </div>
</mat-card>
