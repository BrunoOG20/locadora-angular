<mat-card>

  <mat-toolbar class="nav" color="primary">
    <span>Dependentes Cadastrados </span>
    <button mat-raised-button color="accent" (click)="onAdd()">+ Novo Dependente</button>
  </mat-toolbar>

  <div class="column-flex mat-elevation-z8">

    <app-dependente-list
      *ngIf="dependentes$ | async as dependentes; else loading"
      [dependentes]="dependentes"
      (add)="onAdd()"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
    ></app-dependente-list>

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>

  </div>
</mat-card>
