<mat-card>

  <mat-toolbar class="nav" color="primary">
    <span>Clientes Cadastrados </span>
  </mat-toolbar>

  <div class="column-flex mat-elevation-z8">

    <app-clienteList-list
      *ngIf="clientes$ | async as clientes; else loading"
      [clientes]="clientes"
    ></app-clienteList-list>

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>

  </div>
</mat-card>
